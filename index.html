<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rep &amp; Set Counter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h1 class="text-center mb-4">Rep &amp; Set Counter</h1>

                <!-- Add new exercise -->
                <form id="addForm" class="input-group mb-4">
                    <input type="text" id="exerciseName" class="form-control" placeholder="New exercise (e.g. Lunges)" required>
                    <button type="submit" class="btn btn-success">Add Exercise</button>
                </form>

                <div id="status" class="text-center text-muted mb-3"></div>

                <!-- Exercise list shows here -->
                <div id="dataContainer"></div>

                <div class="d-grid mt-4">
                    <button id="loadDataBtn" class="btn btn-primary">Reload Data</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
